          grep -q 'Copy + Open' out/owner-next.html
          grep -q 'copy-open-all' out/owner-next.html
          grep -q 'Copy + Open all' out/owner-next.html
          grep -q 'actions-sticky' out/owner-next.html
          grep -q 'doCopyOpenAll' out/owner-next.html
