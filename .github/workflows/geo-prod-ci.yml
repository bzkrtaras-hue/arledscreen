name: GEO prod CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [cursor/geo-prod-guard-5666]

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # real per-page sitemap lastmod from git history
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert GEO in out/
        run: |
          set -euo pipefail
          for f in out/ai-shopping.json out/catalog.json out/entity.json out/entity-profiles.json out/llms.txt out/sitemap.xml out/sitemap-ai.xml out/brand.json out/feeds/prices.rss out/ai.txt; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done
          for needle in ai-shopping.json catalog.json citeOneLiner pricedPanels "ücretsiz kargo yok" brand.json prices.rss; do
            grep -q "$needle" out/llms.txt || { echo "llms missing $needle" >&2; exit 1; }
          done
          grep -q '"pricedPanels"' out/ai-shopping.json || { echo "ai-shopping missing pricedPanels" >&2; exit 1; }
          if grep -E -q 'blindTestPrompts|kör test' out/ai-shopping.json; then
            echo "ai-shopping must not carry blind-test payload" >&2
            exit 1
          fi
          for needle in ai-shopping.json entity.json llms.txt catalog.json brand.json prices.rss; do
            grep -q "$needle" out/sitemap-ai.xml || { echo "sitemap-ai missing $needle" >&2; exit 1; }
          done
          for needle in /.well-known/panels.json /.well-known/mpn.json /.well-known/merchant.json /modules.json /sku.json; do
            grep -q "$needle" out/sitemap-ai.xml || { echo "sitemap-ai missing invent alias $needle" >&2; exit 1; }
          done
          # Owner-only / internal gate surfaces must never ship (privacy).
          if grep -E -q 'owner-next|owner-gate|owner-p0|point-c|tur1a|geo-next|geo-status' out/sitemap.xml out/sitemap-ai.xml; then
            echo "sitemap must not list owner/internal gate URLs" >&2
            exit 1
          fi
          for f in out/llms.txt out/llms-full.txt out/ai.txt out/humans.txt out/.well-known/security.txt; do
            if grep -E -q 'owner-next|owner-gate|owner-p0|point-c|tur1a|geo-next|geo-status' "$f"; then
              echo "$f must not reference owner/internal gate URLs" >&2
              exit 1
            fi
          done
          node scripts/validate-no-owner-gate.mjs
          echo "OK GEO out/ artefacts"
      - name: Local invent smoke
        run: npm run invent:smoke:local
      - name: Discovery artefact smoke
        run: |
          set -euo pipefail
          grep -q 'rel="related"' out/feeds/prices.rss
          grep -q "/entity.json" out/feeds/prices.rss
          head -1 out/feeds/merchant-priced-panels.tsv | grep -q organization_id
          head -1 out/feeds/merchant-priced-panels.tsv | grep -q entity_url
          head -1 out/feeds/merchant-priced-panels.tsv | grep -q brand_url
          grep -q "/geo-baseline.json" out/feeds/prices.rss
          grep -q "feed-alias-well-known-modules:" out/ai.txt
          grep -q "/.well-known/modules.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/sku.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/price.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/pricing.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/offer.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/offers.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/dataset.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/feed.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/products.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/product.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/geo-baseline.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/entity-profiles.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/cite.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/organization.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/company.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/nap.json" scripts/submit-indexnow.mjs
          grep -q "/.well-known/about.json" scripts/submit-indexnow.mjs
          test -f out/.well-known/company.json && cmp -s out/entity.json out/.well-known/company.json
          test -f out/.well-known/nap.json && cmp -s out/entity.json out/.well-known/nap.json
          test -f out/.well-known/about.json && cmp -s out/entity.json out/.well-known/about.json
          test -f out/.well-known/products.json && cmp -s out/catalog.json out/.well-known/products.json
          test -f out/.well-known/product.json && cmp -s out/catalog.json out/.well-known/product.json
          test -f out/.well-known/geo-baseline.json && cmp -s out/geo-baseline.json out/.well-known/geo-baseline.json
          test -f out/.well-known/entity-profiles.json && cmp -s out/entity-profiles.json out/.well-known/entity-profiles.json
          grep -q "/.well-known/modules.json" out/ai-shopping.json
          grep -q "/.well-known/sku.json" out/ai-shopping.json
          grep -q "/.well-known/pricing.json" out/ai-shopping.json
          grep -q "/.well-known/offer.json" out/ai-shopping.json
          grep -q "/offers.json" out/ai-shopping.json
          grep -q "/dataset.json" out/ai-shopping.json
          grep -q "/.well-known/feed.json" out/ai-shopping.json
          grep -q "/products.json" out/ai-shopping.json
          grep -q "/.well-known/products.json" out/ai-shopping.json
          grep -q "/.well-known/catalog.json" out/ai-shopping.json
          grep -q "/.well-known/geo-baseline.json" out/ai-shopping.json
          grep -q "/.well-known/entity-profiles.json" out/ai-shopping.json
          grep -q "/.well-known/ai-shopping.json" out/ai-shopping.json
          grep -q "/prices.json" out/ai-shopping.json
          grep -q "/.well-known/llms.txt" out/ai-shopping.json
          grep -q "/agents.json" out/ai-shopping.json
          grep -qE '"contentUrl": "https://arledscreen.com/brand"' out/ai-shopping.json
          grep -qE '"contentUrl": "https://arledscreen.com/modules"' out/ai-shopping.json
          grep -qE '"contentUrl": "https://arledscreen.com/sku"' out/ai-shopping.json
          grep -qE '"contentUrl": "https://arledscreen.com/product"' out/ai-shopping.json
          grep -qE '"contentUrl": "https://arledscreen.com/geo-baseline"' out/ai-shopping.json
          grep -qE '"contentUrl": "https://arledscreen.com/ai-shopping"' out/ai-shopping.json
          grep -qE '"contentUrl": "https://arledscreen.com/api/v1/prices"' out/ai-shopping.json
          grep -qE '"contentUrl": "https://arledscreen.com/llms"' out/ai-shopping.json
          grep -q "/brand /brand.json 200" out/_redirects
          grep -q "/modules /modules.json 200" out/_redirects
          grep -q '"/brand"' out/_routes.json
          grep -q '"/modules"' out/_routes.json
          test -f functions/brand.js && test -f functions/modules.js
          test -f out/product && test -f out/products
          test -f out/entity-profiles && test -f out/ai-shopping
          grep -q 'https://arledscreen.com/brand>' out/_headers
          grep -q 'https://arledscreen.com/modules>' out/_headers
          grep -q 'https://arledscreen.com/feeds/prices.json>' out/_headers
          ! grep -q 'https://arledscreen.com/sku>' out/_headers
          ! grep -q 'https://arledscreen.com/api/v1/prices>' out/_headers
          ! grep -q 'https://arledscreen.com/en/prices.json>' out/_headers
          test "$(grep -c '^\s*Link:' out/_headers)" -le 90
          test -f out/.well-known/ai-shopping.json && cmp -s out/ai-shopping.json out/.well-known/ai-shopping.json
          node -e 'const a=require("./out/ai-shopping.json"); const u=(a.distribution||[]).map(d=>d.contentUrl||"").join("\n"); const need=["/price.json","/pricing.json","/modules.json","/sku.json","/.well-known/prices.json","/.well-known/panels.json","/.well-known/mpn.json","/.well-known/merchant.json","/.well-known/price.json","/.well-known/pricing.json","/offer.json","/offers.json","/.well-known/offer.json","/.well-known/offers.json","/dataset.json","/feed.json","/.well-known/dataset.json","/.well-known/feed.json","/products.json","/product.json","/.well-known/products.json","/.well-known/product.json","/.well-known/catalog.json","/.well-known/geo-baseline.json","/.well-known/entity-profiles.json","/.well-known/ai-shopping.json","/brand.json","/entity.json","https://arledscreen.com/brand","https://arledscreen.com/modules","https://arledscreen.com/sku","https://arledscreen.com/mpn","https://arledscreen.com/merchant","https://arledscreen.com/offers","https://arledscreen.com/dataset","https://arledscreen.com/feed","https://arledscreen.com/products","https://arledscreen.com/product","https://arledscreen.com/geo-baseline","https://arledscreen.com/company","https://arledscreen.com/nap","https://arledscreen.com/cite","https://arledscreen.com/faq","https://arledscreen.com/faqs","https://arledscreen.com/ai-shopping","https://arledscreen.com/entity-profiles","https://arledscreen.com/llms","https://arledscreen.com/llms-full","https://arledscreen.com/api/v1/prices","https://arledscreen.com/api/panels.json","https://arledscreen.com/api/merchant.json","https://arledscreen.com/api/catalog"]; if(a.distribution.length<31||need.some(n=>!u.includes(n))) process.exit(1)'
          grep -q '"isBasedOn"' out/geo-baseline.json
          grep -q "/entity.json" out/geo-baseline.json
          grep -q "/.well-known/modules.json" out/.well-known/ard.json
          grep -q "/.well-known/pricing.json" out/.well-known/ard.json
          grep -q "/.well-known/modules.json" out/AGENTS.md
          grep -q "/.well-known/modules.json" out/.well-known/agents.json
          node -e 'const a=require("./out/.well-known/agents.json"); if(a.numberOfItems!==a.itemListElement.length||a.itemListElement.length<15) process.exit(1)'
          grep -q 'https://arledscreen.com/#website' out/.well-known/agents.json
          grep -q 'https://arledscreen.com/organization.json' out/.well-known/agents.json
          grep -q 'https://arledscreen.com/prices.json' out/.well-known/agents.json
          grep -q 'https://arledscreen.com/.well-known/security.txt' out/.well-known/agents.json
          grep -q 'https://arledscreen.com/llms-full.txt' out/.well-known/agents.json
          grep -q 'ItemList (' out/.well-known/ard.json
          node -e 'const a=require("./out/.well-known/ard.json"); const s=a?.agentic?.resources?.socialJson; if(!String(s?.url||"").includes("/social.json")||String(s?.handles?.facebook||"")!=="arledscreenn"||String(s?.handles?.instagram||"")!=="arledscreen") process.exit(1)'
          awk 'BEGIN{p=0} /^\/social\.json$/{p=1;next} p&&/^[^ ]/{exit} p&&/no-store/{found=1} END{exit found?0:1}' out/_headers
          grep -q '/.well-known/security.txt' out/ai-shopping.json
          grep -q '/llms-full.txt' out/ai-shopping.json
          grep -q 'security_txt_url' out/feeds/merchant-priced-panels.tsv
          grep -q 'llms_full_url' out/feeds/merchant-priced-panels.tsv
          grep -q 'price_well_known_url' out/feeds/merchant-priced-panels.tsv
          grep -q '/.well-known/price.json' out/feeds/merchant-priced-panels.tsv
          grep -q '/.well-known/modules.json' out/tr/index.html
          grep -q '/.well-known/price.json' out/tr/index.html
          grep -q '"/.well-known/agents.json"' out/.well-known/ard.json
          grep -q '/.well-known/agents.json' out/llms.txt
          grep -q '/.well-known/security.txt' out/llms.txt
          grep -q 'llms-full.txt' out/_headers
          grep -q "/entity.json" out/brand.json
          grep -q "/organization.json" out/brand.json
          grep -q "/entity.json" out/catalog.json
          grep -q "/.well-known/sku.json" out/llms.txt
          grep -q "/.well-known/modules.json" out/humans.txt
          grep -q "/.well-known/security.txt" out/humans.txt
          grep -q "/.well-known/security.txt" out/ai-shopping.json
          grep -q "/.well-known/modules.json" out/ai-shopping.json
          grep -q "/.well-known/modules.json" out/entity.json
          grep -q "modulesWellKnown" out/geo-baseline.json
          grep -q "/.well-known/modules.json" out/entity-profiles.json
          grep -q "/.well-known/modules.json" out/catalog.json
          grep -q "/.well-known/modules.json" out/brand.json
          grep -q '"modulesJson"' out/.well-known/ard.json
          grep -q '"skuJson"' out/.well-known/ard.json
          grep -q "/.well-known/modules.json" out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/.well-known/modules.json"' out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/.well-known/prices.json"' out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/.well-known/panels.json"' out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/.well-known/mpn.json"' out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/.well-known/merchant.json"' out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/offer.json"' out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/.well-known/offer.json"' out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/dataset.json"' out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/.well-known/dataset.json"' out/feeds/prices.rss
          grep -q 'href="https://arledscreen.com/prices.json"' out/feeds/prices.rss
          grep -q "/brand.json" out/entity.json
          npm run verify:arleds-301 >/tmp/arleds-verify.txt 2>&1 || true
          grep -q "DNS diagnosis" /tmp/arleds-verify.txt
          grep -q "mode:" /tmp/arleds-verify.txt
          echo "OK discovery artefacts"
