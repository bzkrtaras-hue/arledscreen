name: AI alışveriş regression

on:
  pull_request:
    branches: [main, "cursor/**"]
  push:
    branches: [main, "cursor/ai-alisveris-katalog-5666"]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit:all
      - run: npm run point-c-check
      - run: npm run verify:premerge
