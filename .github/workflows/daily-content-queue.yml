name: Daily content queue

# 09:00 Istanbul (06:00 UTC). Publishes ONE approved item from content-queue/,
# deploys through the same Pages path as deploy-cloudflare-pages.yml, pings IndexNow.
# Empty queue → no deploy; optionally drafts ONE item with Gemini as a PR (never published).
# Pull requests touching the queue run a DRY RUN (validate + publish + build, no push/deploy/ping).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = build only, no push/deploy/IndexNow/PR"
        required: false
        default: "true"
      draft_when_empty:
        description: "Ask Gemini for one draft if the queue is empty"
        required: false
        default: "true"
  pull_request:
    paths:
      - "content-queue/**"
      - "scripts/queue-*.mjs"
      - ".github/workflows/daily-content-queue.yml"

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false') }}
      DRAFT_WHEN_EMPTY: ${{ github.event_name != 'workflow_dispatch' || inputs.draft_when_empty != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Validate queue items
        run: node scripts/queue-publish.mjs --check

      - name: Take oldest queue item
        id: q
        run: node scripts/queue-publish.mjs

      - name: Setup Node
        if: steps.q.outputs.status == 'published'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        if: steps.q.outputs.status == 'published'
        run: npm ci

      - name: Build static export
        if: steps.q.outputs.status == 'published'
        run: npm run build

      - name: Check new page exists in out/
        if: steps.q.outputs.status == 'published'
        run: |
          f="out/tr/rehber/${{ steps.q.outputs.slug }}/index.html"
          test -f "$f" || { echo "missing $f" >&2; exit 1; }
          grep -q "/tr/rehber/${{ steps.q.outputs.slug }}/" out/sitemap.xml || { echo "slug missing from sitemap" >&2; exit 1; }
          echo "OK $f + sitemap"

      - name: Guard — no out/index.html (must not shadow / → /tr/ 301)
        if: steps.q.outputs.status == 'published'
        run: |
          if [ -f out/index.html ]; then
            echo "Refuse deploy: out/index.html would serve 200 at / and block _redirects" >&2
            exit 1
          fi
          test -f out/_redirects
          test -d out/tr

      # Refuse deploy if AI discovery artefacts missing from out/ (would wipe production GEO).
      - name: Guard — GEO artefacts present in out/ before deploy
        if: steps.q.outputs.status == 'published'
        run: |
          set -euo pipefail
          for f in out/llms.txt out/llms-full.txt out/ai-shopping.json out/entity.json out/catalog.json out/entity-profiles.json out/sitemap.xml out/sitemap-ai.xml; do
            test -f "$f" || { echo "Refuse deploy: missing $f" >&2; exit 1; }
          done
          for needle in ai-shopping.json catalog.json citeOneLiner pricedPanels "ücretsiz kargo yok"; do
            grep -q "$needle" out/llms.txt || {
              echo "Refuse deploy: out/llms.txt missing '$needle'" >&2
              exit 1
            }
          done
          grep -q '"pricedPanels"' out/ai-shopping.json || {
            echo "Refuse deploy: out/ai-shopping.json missing pricedPanels" >&2
            exit 1
          }
          grep -q 'blindTestPrompts\|kör test' out/ai-shopping.json && {
            echo "Refuse deploy: ai-shopping.json must not carry blind-test payload" >&2
            exit 1
          }
          for needle in ai-shopping.json entity.json llms.txt catalog.json; do
            grep -q "$needle" out/sitemap-ai.xml || {
              echo "Refuse deploy: out/sitemap-ai.xml missing '$needle'" >&2
              exit 1
            }
          done
          echo "OK GEO pre-deploy guard"

      - name: Commit queue move to main
        if: steps.q.outputs.status != 'empty' && env.DRY_RUN != 'true'
        run: |
          git config user.name "arledscreen-queue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content-queue src
          git commit -m "content-queue: publish ${{ steps.q.outputs.slug }} (${{ steps.q.outputs.status }})"
          git push origin HEAD:main

      - name: Deploy to Cloudflare Pages (same path as deploy-cloudflare-pages.yml)
        if: steps.q.outputs.status == 'published' && env.DRY_RUN != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "4a0f179229f3c6a21d076df944b850e8"
        run: node scripts/pages-deploy-resilient.mjs out

      - name: Cloudflare cache purge (only if CLOUDFLARE_ZONE_ID secret is set)
        if: steps.q.outputs.status == 'published' && env.DRY_RUN != 'true'
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$ZONE" ]; then echo "No CLOUDFLARE_ZONE_ID secret — skip purge"; exit 0; fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"files":["${{ steps.q.outputs.url }}","https://arledscreen.com/sitemap.xml","https://arledscreen.com/tr/rehber/"]}'

      - name: Smoke — new URL live (200)
        if: steps.q.outputs.status == 'published' && env.DRY_RUN != 'true'
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "${{ steps.q.outputs.url }}")
          echo "HTTP $code ${{ steps.q.outputs.url }}"
          test "$code" = "200"

      - name: IndexNow — new URL + sitemap
        if: steps.q.outputs.status == 'published' && env.DRY_RUN != 'true'
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data '{"host":"arledscreen.com","key":"e8e6f86598e94e95a323f807c39843ad","keyLocation":"https://arledscreen.com/e8e6f86598e94e95a323f807c39843ad.txt","urlList":["${{ steps.q.outputs.url }}","https://arledscreen.com/sitemap.xml"]}'

      # ---------- Empty queue: optional Gemini draft as a PR (never published) ----------
      - name: Skip draft if a draft PR is already open
        id: open
        if: steps.q.outputs.status == 'empty' && env.DRAFT_WHEN_EMPTY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --state open --label content-draft --json number --jq length 2>/dev/null || echo 0)
          echo "open=$n" >> "$GITHUB_OUTPUT"; echo "open draft PRs: $n"

      - name: Gemini draft (one item → content-queue/drafts/)
        id: d
        if: steps.q.outputs.status == 'empty' && env.DRAFT_WHEN_EMPTY == 'true' && steps.open.outputs.open == '0'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/queue-draft-gemini.mjs
          f=$(ls content-queue/drafts/*.md 2>/dev/null | head -1 || true)
          [ -n "$f" ] && { echo "--- draft preview ---"; head -40 "$f"; }

      - name: Open draft PR (review required; never auto-merged)
        if: steps.d.outputs.draft_file != '' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b="content-draft/${{ steps.d.outputs.slug }}"
          git config user.name "arledscreen-queue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$b"
          git add "${{ steps.d.outputs.draft_file }}"
          git commit -m "content-queue draft: ${{ steps.d.outputs.slug }} (Gemini, needs review)"
          git push origin "$b"
          gh label create content-draft --color FBCA04 --description "Gemini draft — review before queueing" 2>/dev/null || true
          gh pr create --base main --head "$b" --label content-draft \
            --title "Taslak (Gemini): ${{ steps.d.outputs.slug }} — inceleme gerekli" \
            --body "Kuyruk boş olduğu için Gemini tek taslak üretti. OTOMATİK YAYINLANMAZ. Onay için: ⚠️ işaretli bilgileri doğrula/çıkar, \`status: draft\` satırını sil, dosyayı \`content-queue/\` köküne taşı (ad: YYYY-MM-DD-NN-slug.md)."
