name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: Dispatch target is the selected branch
        required: false
        default: catalog

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # real per-page sitemap lastmod from git history

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Guard — no out/index.html (must not shadow / → /tr/ 301)
        run: |
          if [ -f out/index.html ]; then
            echo "Refuse deploy: out/index.html would serve 200 at / and block _redirects" >&2
            exit 1
          fi
          test -f out/_redirects
          test -d out/tr

      # Refuse deploy if AI discovery artefacts missing from out/ (would wipe production GEO).
      - name: Guard — GEO artefacts present in out/ before deploy
        run: |
          set -euo pipefail
          for f in out/llms.txt out/llms-full.txt out/ai-shopping.json out/entity.json out/catalog.json out/entity-profiles.json out/sitemap.xml out/sitemap-ai.xml; do
            test -f "$f" || { echo "Refuse deploy: missing $f" >&2; exit 1; }
          done
          for needle in ai-shopping.json catalog.json citeOneLiner pricedPanels "ücretsiz kargo yok"; do
            grep -q "$needle" out/llms.txt || {
              echo "Refuse deploy: out/llms.txt missing '$needle'" >&2
              exit 1
            }
          done
          grep -q '"pricedPanels"' out/ai-shopping.json || {
            echo "Refuse deploy: out/ai-shopping.json missing pricedPanels" >&2
            exit 1
          }
          grep -q 'blindTestPrompts\|kör test' out/ai-shopping.json && {
            echo "Refuse deploy: ai-shopping.json must not carry blind-test payload" >&2
            exit 1
          }
          for needle in ai-shopping.json entity.json llms.txt catalog.json; do
            grep -q "$needle" out/sitemap-ai.xml || {
              echo "Refuse deploy: out/sitemap-ai.xml missing '$needle'" >&2
              exit 1
            }
          done
          echo "OK GEO pre-deploy guard"

      # Prefer differential Direct Upload (check-missing → only new hashes).
      # --skip-caching forces full re-upload and fails hard when POST /pages/assets/upload
      # returns 500 (CF Partial System Outage). scripts/pages-deploy-resilient.mjs falls
      # back to JWT batch=1 upload then wrangler again (Functions + _headers/_redirects).
      - name: Deploy to Cloudflare Pages (differential + resilient fallback)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "4a0f179229f3c6a21d076df944b850e8"
        run: node scripts/pages-deploy-resilient.mjs out

      - name: Smoke — apex redirect + AI artefacts + GEO llms/sitemap
        run: |
          set -euo pipefail
          sleep 8
          loc=$(curl -fsSI -A 'Mozilla/5.0' https://arledscreen.com/ | awk 'tolower($1)=="location:" {print $2}' | tr -d '\r')
          case "$loc" in
            /tr/|/tr|https://arledscreen.com/tr/|https://arledscreen.com/tr)
              echo "OK apex / → $loc" ;;
            *)
              echo "Unexpected Location: ${loc:-<empty>}" >&2
              exit 1 ;;
          esac

          for path in /entity.json /catalog.json /ai-shopping.json /.well-known/ard.json; do
            url="https://arledscreen.com${path}"
            code="$(curl -sS -o /tmp/ai-art.body -w '%{http_code}' -A 'Mozilla/5.0' "$url")"
            test "$code" = "200" || { echo "FAIL $code $url" >&2; exit 1; }
            test "$(head -c 1 /tmp/ai-art.body)" = "{" || { echo "FAIL not JSON $url" >&2; exit 1; }
            echo "OK AI artefact $url"
          done

          llms="$(curl -fsSL -A 'Mozilla/5.0' https://arledscreen.com/llms.txt)"
          grep -q 'ai-shopping.json' <<<"$llms" || { echo "FAIL live llms.txt missing ai-shopping.json" >&2; exit 1; }
          grep -q 'citeOneLiner' <<<"$llms" || { echo "FAIL live llms.txt missing citeOneLiner" >&2; exit 1; }
          sm="$(curl -fsSL -A 'Mozilla/5.0' https://arledscreen.com/sitemap.xml)"
          grep -q '<loc>https://arledscreen.com/tr/</loc>' <<<"$sm" || { echo "FAIL live sitemap missing /tr/" >&2; exit 1; }
          smai="$(curl -fsSL -A 'Mozilla/5.0' https://arledscreen.com/sitemap-ai.xml)"
          grep -q 'ai-shopping.json' <<<"$smai" || { echo "FAIL live sitemap-ai missing ai-shopping.json" >&2; exit 1; }
          grep -q 'entity.json' <<<"$smai" || { echo "FAIL live sitemap-ai missing entity.json" >&2; exit 1; }

          # Live graph must include entity-first price authority (post–makesOffer ships).
          ent="$(curl -fsSL -A 'Mozilla/5.0' https://arledscreen.com/entity.json)"
          grep -q 'makesOffer' <<<"$ent" || { echo "FAIL live entity.json missing makesOffer" >&2; exit 1; }
          grep -q '#priced-panels-aggregate' <<<"$ent" || { echo "FAIL live entity missing AggregateOffer @id" >&2; exit 1; }
          grep -q '#localbusiness' <<<"$ent" || { echo "FAIL live entity missing #localbusiness location" >&2; exit 1; }
          echo "OK live GEO llms + sitemap + entity price graph"

      - name: IndexNow — ping GEO / invent surfaces after Production smoke
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true
