name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: Dispatch target is the selected branch
        required: false
        default: catalog

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Guard — no out/index.html (must not shadow / → /tr/ 301)
        run: |
          if [ -f out/index.html ]; then
            echo "Refuse deploy: out/index.html would serve 200 at / and block _redirects" >&2
            exit 1
          fi
          test -f out/_redirects
          test -d out/tr

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4a0f179229f3c6a21d076df944b850e8"
          command: pages deploy out --project-name=arledscreen --branch=main --commit-dirty=true

      - name: Smoke — apex redirect
        run: |
          sleep 8
          loc=$(curl -fsSI -A 'Mozilla/5.0' https://arledscreen.com/ | awk 'tolower($1)=="location:" {print $2}' | tr -d '\r')
          case "$loc" in
            /tr/|/tr|https://arledscreen.com/tr/|https://arledscreen.com/tr)
              echo "OK apex / → $loc" ;;
            *)
              echo "Unexpected Location: ${loc:-<empty>}" >&2
              exit 1 ;;
          esac
