# Cloudflare Pages — static export from `out/` (see npm run build + postbuild).
# Deploy: npx wrangler pages deploy out --project-name=arledscreen
# account_id via CLOUDFLARE_ACCOUNT_ID / wrangler-action (Pages config rejects account_id).
name = "arledscreen"
compatibility_date = "2026-10-04"
pages_build_output_dir = "out"
