  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.85"/>
  <circle cx="960" cy="540" r="220" fill="none" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="2"/>
  <text x="960" y="550" text-anchor="middle" fill="#00F0FF" fill-opacity="0.35" font-family="system-ui,sans-serif" font-size="28" letter-spacing="8">NXTIONSTAR</text>
